name: Build & deploy CO—SAT to GitHub Pages
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours (CelesTrak asks for ≥2 h between pulls)
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Persist the upstream cache between runs so the TTL logic (3 h elements, 24 h SATCAT)
      # decides what to re-fetch; a push never triggers an extra CelesTrak pull if data is fresh.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: cosat-upstream-${{ github.run_id }}
          restore-keys: cosat-upstream-
      - run: node scripts/build-static.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
